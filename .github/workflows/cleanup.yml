name: Remove old releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete every release and tag except the newest
        run: |
          keep=3.3.3
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName'); do
            [ "$tag" = "$keep" ] || gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
          for tag in $(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags" --paginate -q '.[].ref' | sed 's#refs/tags/##'); do
            [ "$tag" = "$keep" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
          done
          for branch in $(gh api "repos/$GITHUB_REPOSITORY/branches" --paginate -q '.[].name'); do
            [ "$branch" = main ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done
