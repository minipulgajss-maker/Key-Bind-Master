name: Discord

on:
  push:
    branches: [main]
    paths: ['release/VERSION', '.github/discord/**', '.github/workflows/discord.yml']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'setup or announce'
        default: 'setup'

permissions:
  contents: read

concurrency:
  group: discord
  cancel-in-progress: false

jobs:
  info:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep the info message up to date
        run: node .github/discord/info.mjs
      - name: Apply automatic moderation
        run: node .github/discord/automod.mjs
      - name: Leave every other server
        run: node .github/discord/leave.mjs

  setup:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'setup'
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Roles, channels and permissions
        run: node .github/discord/setup.mjs

  announce:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'announce'
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Post the special code
        run: node .github/discord/announce.mjs
