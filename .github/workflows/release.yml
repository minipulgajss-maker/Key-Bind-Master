name: Publish release

on:
  push:
    branches: [main]
    paths: ['release/KeyBind-Master-Setup.exe']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish the signed installer
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        run: |
          version=$(tr -d '[:space:]' < release/VERSION)
          if gh release view "$version" > /dev/null 2>&1; then
            exit 0
          fi
          {
            echo "version: $version"
            echo "files:"
            echo "  - url: KeyBind-Master-Setup.exe"
            echo "    sha512: $(openssl dgst -sha512 -binary release/KeyBind-Master-Setup.exe | base64 -w0)"
            echo "    size: $(stat -c %s release/KeyBind-Master-Setup.exe)"
            echo "path: KeyBind-Master-Setup.exe"
            echo "sha512: $(openssl dgst -sha512 -binary release/KeyBind-Master-Setup.exe | base64 -w0)"
            echo "releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'"
          } > latest.yml
          gh release create "$version" release/KeyBind-Master-Setup.exe latest.yml \
            --target "${{ github.sha }}" \
            --title "KeyBind Master $version" \
            --notes "Minimum version: $(tr -d '[:space:]' < release/minimum-version.txt)" --latest
