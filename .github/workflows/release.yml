name: Publish release

on:
  push:
    branches: [main]
    paths: ['release/KeyBind-Master-Setup.exe']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish the signed installer
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        id: check
        run: |
          version=$(tr -d '[:space:]' < release/VERSION)
          if gh release view "$version" > /dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Announce on Discord
        continue-on-error: true
        if: steps.check.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node .github/discord/post.mjs
      - name: Publish the release
        if: steps.check.outputs.new == 'true'
        run: |
          version=$(tr -d '[:space:]' < release/VERSION)
          {
            echo "version: $version"
            echo "files:"
            echo "  - url: KeyBind-Master-Setup.exe"
            echo "    sha512: $(openssl dgst -sha512 -binary release/KeyBind-Master-Setup.exe | base64 -w0)"
            echo "    size: $(stat -c %s release/KeyBind-Master-Setup.exe)"
            echo "path: KeyBind-Master-Setup.exe"
            echo "sha512: $(openssl dgst -sha512 -binary release/KeyBind-Master-Setup.exe | base64 -w0)"
            echo "releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'"
          } > latest.yml
          gh release create "$version" release/KeyBind-Master-Setup.exe latest.yml \
            --target "${{ github.sha }}" \
            --title "KeyBind Master $version" \
            --notes-file release/NOTES.md --latest
